<div class="stepper-div">
  <sh-stepper ta-id="GuidanceAppStepper" vertical color='primary'class="stepper-pane">
    @for (step of steps; track step.id) {
      <sh-stepper-item
        class="text"
        [attr.ta-id]="'GuidanceAppStepperStep' + (step.id + 1)"
        [attr.label]="step.label | t"
        [active]="step.active"
        [type]="step.status">
      </sh-stepper-item>
    }
  </sh-stepper>
</div>
